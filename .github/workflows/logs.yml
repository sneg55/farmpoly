name: Check Logs

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch container logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Container status ==="
            docker ps --filter name=polyfarm --format "{{.Status}} ({{.RunningFor}})"
            echo ""
            echo "=== Last 200 lines ==="
            docker logs polyfarm --tail 200 2>&1
