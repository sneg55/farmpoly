name: Build & Push Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Deployment strategy: Replace with graceful shutdown
            # 1. Pull new image
            # 2. Stop old container with 30s timeout (allows order cancellation)
            # 3. Start new container
            # 4. Verify new container is healthy
            # Note: ~30-40s downtime during deployment
            
            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}:latest
            
            # Gracefully stop old container (30s timeout for order cancellation)
            echo "Stopping old container (graceful shutdown)..."
            docker stop --time 30 polyfarm || true
            docker rm polyfarm || true
            
            # Create .env file
            cat > /opt/farmpoly/.env << 'EOF'
            POLYGON_PRIVATE_KEY=${{ secrets.POLYGON_PRIVATE_KEY }}
            POLYGON_RPC_URL=${{ secrets.POLYGON_RPC_URL }}
            CLOB_API_URL=https://clob.polymarket.com
            GAMMA_API_URL=https://gamma-api.polymarket.com
            EOF
            
            # Start new container
            docker run -d \
              --name polyfarm \
              --restart unless-stopped \
              -v /opt/farmpoly-data:/data \
              --env-file /opt/farmpoly/.env \
              ghcr.io/${{ github.repository }}:latest \
              run --budget 100 --spread 5 --max-markets 10 --rebalance-interval 60 --min-daily-yield 1
            
            # Wait for container to start and verify it's running
            sleep 5
            if ! docker ps | grep -q polyfarm; then
              echo "ERROR: Container failed to start"
              docker logs polyfarm --tail 100
              exit 1
            fi
            
            # Show startup logs
            echo "=== Deployment successful ==="
            docker logs polyfarm --tail 50
