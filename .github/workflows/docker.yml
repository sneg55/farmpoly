name: Build & Push Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Deployment strategy: Replace with graceful shutdown
            # 1. Pull new image
            # 2. Stop old containers (bot + dashboard) with 30s timeout
            # 3. Start new bot + dashboard containers
            # 4. Verify containers are healthy
            # Note: ~30-40s downtime during deployment

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}:latest

            # Clean up any stale containers from previous naming schemes
            docker stop polyfarm-bot 2>/dev/null || true
            docker rm polyfarm-bot 2>/dev/null || true

            # Gracefully stop bot container (30s timeout for order cancellation)
            echo "Stopping bot container (graceful shutdown)..."
            docker stop --time 30 polyfarm || true
            docker rm polyfarm || true

            # Stop dashboard container
            echo "Stopping dashboard container..."
            docker stop polyfarm-dashboard || true
            docker rm polyfarm-dashboard || true

            # Create .env file
            cat > /opt/farmpoly/.env << 'EOF'
            POLYGON_PRIVATE_KEY=${{ secrets.POLYGON_PRIVATE_KEY }}
            POLYGON_RPC_URL=${{ secrets.POLYGON_RPC_URL }}
            CLOB_API_URL=https://clob.polymarket.com
            GAMMA_API_URL=https://gamma-api.polymarket.com
            EOF

            # Start bot container
            # TWO-SIDED LIQUIDITY: Mint-and-quote with 2x reward multiplier
            # --spread 2: Target 2c from midpoint (67% spread quality vs 27% at 3c)
            # --danger-zone 3: Graduated response (yellow warning at 3c, red cancel at 1.5c)
            # --max-markets 5: Focus on top 5 by profitability × stability
            # --max-volatility 5: Skip markets with >5c 24h price change
            # --placement-mode adaptive: Trend-based order placement
            # --hedge-fills: Auto-hedge fills (inventory merge → hedge fallback → on-chain merge)
            # --warmup-seconds 5: Collect WS midpoints before placing orders
            # --rebalance-interval 60: Re-score markets every hour
            docker run -d \
              --name polyfarm \
              --restart on-failure:10 \
              -v /opt/farmpoly-data:/data \
              --env-file /opt/farmpoly/.env \
              ghcr.io/${{ github.repository }}:latest \
              run --budget 500 --spread 2 --danger-zone 3 --max-markets 5 --max-volatility 5 --placement-mode adaptive --hedge-fills --warmup-seconds 5 --rebalance-interval 60

            # Start dashboard container (shares DB volume + env)
            docker run -d \
              --name polyfarm-dashboard \
              --restart on-failure:10 \
              -p 3737:3737 \
              -v /opt/farmpoly-data:/data \
              --env-file /opt/farmpoly/.env \
              -e POLYFARM_DASHBOARD_HOST=0.0.0.0 \
              -e POLYFARM_DASHBOARD_TOKEN=${{ secrets.DASHBOARD_TOKEN }} \
              ghcr.io/${{ github.repository }}:latest \
              dashboard

            # Wait for containers to start and verify
            sleep 5
            if ! docker ps | grep -q polyfarm; then
              echo "ERROR: Bot container failed to start"
              docker logs polyfarm --tail 100
              exit 1
            fi
            if ! docker ps | grep -q polyfarm-dashboard; then
              echo "ERROR: Dashboard container failed to start"
              docker logs polyfarm-dashboard --tail 100
              exit 1
            fi

            # Show startup logs
            echo "=== Deployment successful ==="
            echo "--- Bot logs ---"
            docker logs polyfarm --tail 30
            echo "--- Dashboard logs ---"
            docker logs polyfarm-dashboard --tail 10
